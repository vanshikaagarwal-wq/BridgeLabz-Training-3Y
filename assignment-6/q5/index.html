<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Plans</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Choose Your Plan</h1>

    <main class="pricing">

        <div class="card">
            <h2>Basic</h2>
            <p class="price">₹499</p>
            <p>5 Projects</p>
            <p>Basic Support</p>
            <p>1 GB Storage</p>
            <button>Choose Plan</button>
        </div>

        <div class="card featured">
            <h2>Premium</h2>
            <p class="price">₹999</p>
            <p>Unlimited Projects</p>
            <p>Priority Support</p>
            <p>10 GB Storage</p>
            <button>Choose Plan</button>
        </div>

        <div class="card">
            <h2>Pro</h2>
            <p class="price">₹1499</p>
            <p>Unlimited Projects</p>
            <p>24/7 Support</p>
            <p>50 GB Storage</p>
            <button>Choose Plan</button>
        </div>

    </main>

</body>
</html>
