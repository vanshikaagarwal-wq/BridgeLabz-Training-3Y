<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>My Photo Gallery</h1>

    <div class="gallery">

        <figure>
            <img src="https://images.unsplash.com/photo-1500534623283-312aade485b7" alt="Mountain landscape">
            <figcaption>Mountain Landscape</figcaption>
        </figure>

        <figure>
            <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e" alt="Beach">
            <figcaption>Beautiful Beach</figcaption>
        </figure>

        <figure>
            <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e" alt="Forest">
            <figcaption>Green Forest</figcaption>
        </figure>

        <figure>
            <img src="https://images.unsplash.com/photo-1500534623283-312aade485b7" alt="Nature">
            <figcaption>Nature View</figcaption>
        </figure>

        <figure>
            <img src="https://images.unsplash.com/photo-1469474968028-56623f02e42e" alt="Landscape">
            <figcaption>Peaceful Landscape</figcaption>
        </figure>

        <figure>
            <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e" alt="Lake">
            <figcaption>Mountain Lake</figcaption>
        </figure>

    </div>

</body>
</html>
