<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Transforms</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>CSS Transform Showcase</h1>
        <p>Rotate, Scale, Translate and Skew</p>
    </header>

    <main>
        <section class="transform-container">

            <div class="transform-box rotate">
                <h2>Rotate</h2>
                <p>Rotates the element.</p>
            </div>

            <div class="transform-box scale">
                <h2>Scale</h2>
                <p>Changes the element size.</p>
            </div>

            <div class="transform-box translate">
                <h2>Translate</h2>
                <p>Moves the element.</p>
            </div>

            <div class="transform-box skew">
                <h2>Skew</h2>
                <p>Tilts the element.</p>
            </div>

        </section>
    </main>

    <footer>
        <p>&copy; 2026 CSS Transform Showcase</p>
    </footer>

</body>
</html>
