<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Height and Width Practice</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Height & Width Practice</h1>
        <p>Exploring different CSS sizing units</p>
    </header>

    <main>
        <section class="boxes">

            <div class="box box-one">
                <h2>Pixels</h2>
                <p>
                    Width: 220px<br>
                    Height: 180px
                </p>
            </div>

            <div class="box box-two">
                <h2>Percentage</h2>
                <p>
                    Width: 30%<br>
                    Height: 25vh
                </p>
            </div>

            <div class="box box-three">
                <h2>EM Units</h2>
                <p>
                    Width: 18em<br>
                    Height: 12em
                </p>
            </div>

        </section>
    </main>

    <footer>
        <p>&copy; 2026 CSS Practice</p>
    </footer>

</body>
</html>
