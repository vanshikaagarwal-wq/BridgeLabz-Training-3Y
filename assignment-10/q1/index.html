<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NovaTech - Company Landing Page</title>

    <!-- Bootstrap 5 CDN -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
        
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Full-width header with Bootstrap navbar -->
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container">

                <a class="navbar-brand fw-bold" href="#">
                    NovaTech
                </a>

                <button
                    class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#mainNav">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="mainNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="#">Home</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="#">About</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="#">Services</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="#">Contact</a>
                        </li>
                    </ul>
                </div>

            </div>
        </nav>
    </header>

    <!-- Hero section -->
    <main>

        <section class="hero py-5">
            <div class="container">
                <div class="row align-items-center min-vh-75">

                    <div class="col-lg-7 text-center text-lg-start">
                        <h1 class="display-4 fw-bold">
                            Build Better Digital Experiences
                        </h1>

                        <p class="lead my-4">
                            NovaTech helps startups and businesses create
                            modern, reliable and user-friendly digital products.
                        </p>

                        <a href="#" class="btn btn-primary btn-lg">
                            Get Started
                        </a>
                    </div>

                    <div class="col-lg-5 text-center mt-4 mt-lg-0">
                        <img
                            src="https://images.unsplash.com/photo-1556761175-b413da4baf72"
                            alt="Team working together"
                            class="img-fluid rounded shadow">
                    </div>

                </div>
            </div>
        </section>

    </main>

    <footer class="bg-dark text-white text-center py-3">
        <p class="mb-0">
            &copy; 2026 NovaTech. All Rights Reserved.
        </p>
    </footer>

</body>
</html>
