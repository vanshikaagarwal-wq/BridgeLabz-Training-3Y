<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Catalog</title>

    <!-- Bootstrap 5 CDN -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-light">

    <header class="bg-dark text-white text-center py-4">
        <h1 class="fw-bold">TechStore</h1>
        <p class="mb-0">Quality gadgets at great prices</p>
    </header>

    <main class="container py-5">

        <h2 class="text-center fw-bold mb-4">
            Our Products
        </h2>

        <!-- Bootstrap row and responsive columns -->
        <div class="row g-4">

            <div class="col-12 col-md-6 col-lg-3">
                <div class="card product-card shadow-sm h-100">
                    <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e"
                         class="card-img-top"
                         alt="Headphones">

                    <div class="card-body text-center">
                        <h5 class="card-title">Wireless Headphones</h5>
                        <p class="fw-bold">₹2,499</p>
                        <button class="btn btn-primary">Add to Cart</button>
                    </div>
                </div>
            </div>

            <div class="col-12 col-md-6 col-lg-3">
                <div class="card product-card shadow-sm h-100">
                    <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30"
                         class="card-img-top"
                         alt="Smart Watch">

                    <div class="card-body text-center">
                        <h5 class="card-title">Smart Watch</h5>
                        <p class="fw-bold">₹3,999</p>
                        <button class="btn btn-primary">Add to Cart</button>
                    </div>
                </div>
            </div>

            <div class="col-12 col-md-6 col-lg-3">
                <div class="card product-card shadow-sm h-100">
                    <img src="https://images.unsplash.com/photo-1608043152269-423dbba4e7e1"
                         class="card-img-top"
                         alt="Bluetooth Speaker">

                    <div class="card-body text-center">
                        <h5 class="card-title">Bluetooth Speaker</h5>
                        <p class="fw-bold">₹1,999</p>
                        <button class="btn btn-primary">Add to Cart</button>
                    </div>
                </div>
            </div>

            <div class="col-12 col-md-6 col-lg-3">
                <div class="card product-card shadow-sm h-100">
                    <img src="https://images.unsplash.com/photo-1527814050087-3793815479db"
                         class="card-img-top"
                         alt="Gaming Mouse">

                    <div class="card-body text-center">
                        <h5 class="card-title">Gaming Mouse</h5>
                        <p class="fw-bold">₹1,499</p>
                        <button class="btn btn-primary">Add to Cart</button>
                    </div>
                </div>
            </div>

        </div>

    </main>

    <footer class="bg-dark text-white text-center py-3">
        <p class="mb-0">&copy; 2026 TechStore. All Rights Reserved.</p>
    </footer>

</body>
</html>
