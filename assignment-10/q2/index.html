<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Harsh Goyal - Portfolio</title>

    <!-- Bootstrap 5 CDN -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-light text-dark">

    <header class="container text-center mt-4">
        <h1 class="fw-bold">Harsh Goyal</h1>
        <p class="lead">Computer Science Student & Web Development Enthusiast</p>
    </header>

    <main class="container">

        <section class="text-center p-5 mb-3">

            <!-- Bootstrap responsive circular image -->
            <img
                src="https://images.unsplash.com/photo-1531482615713-2afd69097998"
                alt="Profile"
                class="img-fluid rounded-circle profile-img mb-4">

            <h2 class="fw-bold">Hello, I'm Harsh!</h2>

            <p class="mt-4">
                I am a Computer Science student passionate about
                web development, technology and building creative
                digital solutions.
            </p>

            <div class="mt-4">
                <a href="#" class="btn btn-primary me-2">
                    Hire Me
                </a>

                <a href="#" class="btn btn-outline-dark">
                    Download CV
                </a>
            </div>

        </section>

        <!-- Contact Form -->
        <section class="bg-white p-5 mb-3 rounded shadow-sm">

            <h2 class="text-center fw-bold mb-4">
                Contact Me
            </h2>

            <form>

                <div class="mb-3">
                    <label for="name" class="form-label">
                        Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        class="form-control"
                        placeholder="Enter your name">
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        class="form-control"
                        placeholder="Enter your email">
                </div>

                <div class="mb-3">
                    <label for="message" class="form-label">
                        Message
                    </label>

                    <textarea
                        id="message"
                        class="form-control"
                        rows="4"
                        placeholder="Write your message"></textarea>
                </div>

                <div class="text-center">
                    <button type="submit" class="btn btn-primary">
                        Send Message
                    </button>
                </div>

            </form>

        </section>

    </main>

    <footer class="bg-dark text-white text-center p-3 mt-4">
        <p class="mb-0">&copy; 2026 Harsh Goyal. All Rights Reserved.</p>
    </footer>

</body>
</html>
