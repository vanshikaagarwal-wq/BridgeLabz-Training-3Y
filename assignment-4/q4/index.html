
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Form Builder</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            background: #f4f4f4;
        }

        #formContainer {
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        label {
            display: block;
            margin-top: 15px;
        }

        input, button {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            box-sizing: border-box;
        }

        button {
            cursor: pointer;
            background: #222;
            color: white;
            border: none;
            border-radius: 5px;
        }

        #result {
            white-space: pre-wrap;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>Custom Form Builder</h1>

    <div id="formContainer"></div>

    <h2>Submitted Data</h2>
    <pre id="result"></pre>

    <script src="script.js"></script>
</body>
</html>
