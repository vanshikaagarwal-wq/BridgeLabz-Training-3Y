<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            background: #f4f4f4;
        }

        section {
            background: white;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        input, button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            box-sizing: border-box;
        }

        button {
            background: #222;
            color: white;
            border: none;
            cursor: pointer;
        }

        #result {
            white-space: pre-line;
            line-height: 1.7;
        }
    </style>
</head>
<body>

    <h1>Shopping Cart</h1>

    <section>
        <h2>Cart Items</h2>
        <div id="items"></div>
    </section>

    <section>
        <h2>Apply Coupon</h2>

        <label for="coupon">Coupon Code</label>
        <input type="text" id="coupon" placeholder="SAVE20 or DISC10">

        <button id="applyCoupon">Apply Coupon</button>

        <p id="message" aria-live="polite"></p>
        <p id="result"></p>
    </section>

    <script src="script.js"></script>
</body>
</html>
