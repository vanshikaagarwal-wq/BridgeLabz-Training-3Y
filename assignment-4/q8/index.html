<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Object Updater</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 40px auto;
            padding: 20px;
            background: #f4f4f4;
        }

        form, #userDetails {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
        }

        label {
            display: block;
            margin-top: 12px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            box-sizing: border-box;
        }

        button {
            margin-top: 20px;
            padding: 10px;
            width: 100%;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>Dynamic Object Updater</h1>

    <form id="userForm">
        <label for="name">Name</label>
        <input type="text" id="name" required>

        <label for="email">Email</label>
        <input type="email" id="email" required>

        <label for="age">Age</label>
        <input type="number" id="age" min="1" required>

        <button type="submit">Update User</button>
    </form>

    <section id="userDetails">
        <h2>Updated User Details</h2>
        <pre id="output"></pre>
    </section>

    <script src="script.js"></script>
</body>
</html>
