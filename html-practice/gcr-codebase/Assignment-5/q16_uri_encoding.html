<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>URI Encoding</title></head>
<body>
    <h1>URI Encoding Example</h1>
    <p>Original URL: https://example.com/search?query=HTML &amp; CSS</p>
    <p>
        Correct encoded URL:
        <a href="https://example.com/search?query=HTML%20%26%20CSS">Search HTML and CSS</a>
    </p>
</body>
</html>
