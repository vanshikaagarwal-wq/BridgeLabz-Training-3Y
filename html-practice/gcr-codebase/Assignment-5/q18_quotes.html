<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Quotations</title></head>
<body>
    <h1>HTML Quotations</h1>
    <!-- Long quotation using blockquote -->
    <blockquote>
        The future belongs to those who believe in the beauty of their dreams
        &amp; continue working towards their goals.
    </blockquote>
    <!-- Short quotation using q -->
    <p>My teacher always says, <q>Practice makes perfect.</q></p>
</body>
</html>
